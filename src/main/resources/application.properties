spring.application.name=GebxByBlog
server.port=${PORT:9090}
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.frontend-url=${APP_FRONTEND_URL:https://gebxby.vercel.app}
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,https://gebxby.vercel.app}
app.admin-emails=${ADMIN_EMAILS:}
app.manual-login-enabled=${APP_MANUAL_LOGIN_ENABLED:false}
app.max-upload-bytes=${APP_MAX_UPLOAD_BYTES:5242880}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-dev-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-dev-client-secret}
spring.security.oauth2.client.registration.google.scope=profile, email

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gebxby_db}
